version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: shadidriver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shadidriver}
      POSTGRES_USER: ${POSTGRES_USER:-shadidriver_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shadidriver_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shadidriver_admin} -d ${POSTGRES_DB:-shadidriver}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shadidriver-network

  redis:
    image: redis:7-alpine
    container_name: shadidriver-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-shadidriver_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-shadidriver_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shadidriver-network

  backend:
    image: node:20-alpine
    container_name: shadidriver-backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "echo 'Backend service placeholder: replace with NestJS entrypoint' && tail -f /dev/null"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shadidriver_admin}:${POSTGRES_PASSWORD:-shadidriver_secret}@postgres:5432/${POSTGRES_DB:-shadidriver}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-shadidriver_redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_ceremonial_jwt_key_32bytes}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shadidriver-network

  caddy:
    image: caddy:2-alpine
    container_name: shadidriver-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - shadidriver-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  shadidriver-network:
    driver: bridge
