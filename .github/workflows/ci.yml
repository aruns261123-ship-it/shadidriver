name: ShadiDriver CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Flutter Client Static Analysis, Formatting & Automated Tests
  # ---------------------------------------------------------------------------
  flutter-check:
    name: Flutter Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Project Source
        run: flutter analyze --fatal-infos

      - name: Run Full Test Suite
        run: flutter test --coverage

      - name: Upload Test Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage-report
          path: coverage/lcov.info

  # ---------------------------------------------------------------------------
  # 2. Database Migration & Backend Service Verification
  # ---------------------------------------------------------------------------
  backend-check:
    name: Database Migration & Backend Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: shadidriver_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate 0001_init.sql Migration Syntax
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d shadidriver_test -f infra/migrations/0001_init.sql

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: 'backend/package.json'

      - name: Check Backend Directory
        run: |
          if [ -d "backend" ] && [ -f "backend/package.json" ]; then
            cd backend
            npm ci
            npm run lint
            npm test
          else
            echo "Backend directory not yet scaffolded. Migration verification completed successfully."
          fi

  # ---------------------------------------------------------------------------
  # 3. Release Build (Runs only on release tags v*)
  # ---------------------------------------------------------------------------
  mobile-release-build:
    name: Build Production Android App Bundle
    needs: [flutter-check, backend-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Upload Release Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadidriver-release-appbundle
          path: build/app/outputs/bundle/release/*.aab
